[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build:api"
watchPatterns = [
  "apps/api/**",
  "packages/database/**",
  "package.json",
  "package-lock.json",
  "railway.toml",
]

[build.env]
NIXPACKS_NODE_VERSION = "20"

[deploy]
startCommand = "npm run start:api:prod"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
